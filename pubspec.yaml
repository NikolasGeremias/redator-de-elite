name: redator_de_elite
description: "App do curso Redação Elite — envio e correção de redações."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  google_sign_in: ^6.2.0

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  image_picker: ^1.1.2
  intl: ^0.20.2
  fl_chart: ^0.69.2
  firebase_storage: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Century751
      fonts:
        - asset: assets/fonts/Century751-BoldItalic.ttf
          style: italic
          weight: 700
    - family: Galyon
      fonts:
        - asset: assets/fonts/Galyon-BookItalic.otf
          style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo_redacao_elite.png"
  min_sdk_android: 23
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo_redacao_elite.png"
  adaptive_icon_foreground_inset: 16
  background_color_ios: "#000000"
  remove_alpha_ios: false

flutter_native_splash:
  color: "#000000"
  image: "assets/images/logo_redacao_elite.png"
  android: true
  ios: false
  web: false
  android_12:
    image: "assets/images/logo_redacao_elite.png"
    color: "#000000"
    icon_background_color: "#000000"
